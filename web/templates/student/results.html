{% extends "base.html" %}
{% set active_nav = 'results' %}
{% block title %}正式选课结果{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">本学期正式选课结果清单</h1>
  <button class="btn btn-outline btn-sm" onclick="loadResults()">刷新状态</button>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>班次 ID</th>
          <th>课程编号</th>
          <th>课程名称</th>
          <th>学分</th>
          <th>任课教师</th>
          <th>上课地点与时段</th>
          <th>抽签与选课状态</th>
        </tr>
      </thead>
      <tbody id="results-body">
        <tr><td colspan="7" class="empty-state">正在获取选课结果...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadResults() {
  try {
    const data = await SECD.request("/api/v1/student/registration/results");
    const tbody = document.getElementById("results-body");
    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state">暂无已生效的正式选课记录，选课可能仍在进行中或尚未提交。</td></tr>`;
      return;
    }
    tbody.innerHTML = data.map(item => `
      <tr>
        <td>#${item.section_id}</td>
        <td><strong>${item.course_code}</strong></td>
        <td>${item.course_name}</td>
        <td>${item.credits}</td>
        <td>${item.teacher_name}</td>
        <td>${item.schedule_time} (${item.classroom})</td>
        <td>
          <span class="role-badge ${item.status === 'ENROLLED' ? 'role-student' : 'role-teacher'}">
            ${item.status === 'ENROLLED' ? '选课成功 (ENROLLED)' : item.status}
          </span>
        </td>
      </tr>
    `).join("");
  } catch (err) {
    document.getElementById("results-body").innerHTML = `<tr><td colspan="7" class="empty-state">加载选课结果失败</td></tr>`;
  }
}
document.addEventListener("DOMContentLoaded", loadResults);
</script>
{% endblock %}
