{% extends "base.html" %}
{% set active_nav = "draft" %}
{% block title %}选课草稿与排序{% endblock %}
{% block content %}
<section id="student-workspace" data-mode="draft">
  <div class="page-header"><h1 class="page-title">选课草稿与排序</h1><div class="action-row"><button class="btn btn-secondary" id="save-draft">保存草稿</button><button class="btn btn-primary" id="submit-draft">提交正式选课</button></div></div>
  <div class="card"><label for="semester-selector" class="form-label">学期</label><select id="semester-selector" class="form-select" aria-label="选择学期"></select><p id="semester-status" role="status"></p><p>首次提交须选齐 4 个主选和 2 个备选；后续修改允许不足 4 门。先保存草稿，再提交正式结果。</p><p id="save-status" role="status"></p><p id="capacity-notice" class="status-note" role="alert"></p></div>
  <div class="card"><h2 style="font-size:1.1rem">草稿明细</h2><div class="table-responsive"><table class="table"><thead><tr><th>课程 / 班次</th><th>课程信息</th><th>教师 / 时间</th><th>正式人数</th><th>选择类别 / 优先级</th><th>操作</th></tr></thead><tbody id="student-rows"><tr><td colspan="6">正在加载…</td></tr></tbody></table></div></div>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/student.js"></script>{% endblock %}
