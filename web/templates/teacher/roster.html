{% extends "base.html" %}
{% set active_nav = 'roster' %}
{% block title %}教学班学生名单{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">教学班学生花名册</h1>
  <div style="display:flex; gap:0.5rem;">
    <select id="section-selector" class="form-select" style="width: auto;" onchange="loadRoster(this.value)">
      <option value="">-- 请选择任教班次 --</option>
    </select>
    <button class="btn btn-outline btn-sm" onclick="exportCSV()">导出花名册</button>
  </div>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table" id="roster-table">
      <thead>
        <tr>
          <th>序号</th>
          <th>学号</th>
          <th>姓名</th>
          <th>行政院系 / 专业</th>
          <th>选课确认时间</th>
          <th>电子邮箱</th>
        </tr>
      </thead>
      <tbody id="roster-body">
        <tr><td colspan="6" class="empty-state">请在右上角下拉列表中选择您负责的班次。</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentRosterList = [];

async function loadTeacherSections() {
  try {
    const sections = await SECD.request("/api/v1/teacher/my-sections");
    const sel = document.getElementById("section-selector");
    sel.innerHTML = `<option value="">-- 请选择任教班次 --</option>` + sections.map(s => `
      <option value="${s.id}">#${s.id} - ${s.course_code}${s.course_name}</option>
    `).join("");
    if (sections.length > 0) {
      sel.value = sections[0].id;
      loadRoster(sections[0].id);
    }
  } catch (err) {}
}

async function loadRoster(sectionId) {
  if (!sectionId) return;
  try {
    const data = await SECD.request(`/api/v1/teacher/sections/${sectionId}/roster`);
    currentRosterList = data || [];
    const tbody = document.getElementById("roster-body");
    if (currentRosterList.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-state">本教学班当前暂无选课成功的学生名单。</td></tr>`;
      return;
    }
    tbody.innerHTML = currentRosterList.map((stu, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${stu.student_number}</strong></td>
        <td>${stu.full_name}</td>
        <td>${stu.department || '-'}</td>
        <td>${stu.enrolled_at || '-'}</td>
        <td>${stu.email || '-'}</td>
      </tr>
    `).join("");
  } catch (err) {
    document.getElementById("roster-body").innerHTML = `<tr><td colspan="6" class="empty-state">拉取学生名单失败</td></tr>`;
  }
}

function exportCSV() {
  if (!currentRosterList || currentRosterList.length === 0) {
    SECD.showToast("名单为空，无法导出", "warning");
    return;
  }
  let csv = "序号,学号,姓名,院系,选课时间,邮箱\n";
  currentRosterList.forEach((s, i) => {
    const dept = s.department || '';
    const enrolled = s.enrolled_at || '';
    const email = s.email || '';
    csv += `${i + 1},${s.student_number},${s.full_name},${dept},${enrolled},${email}\n`;
  });
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "教学班学生花名册.csv";
  a.click();
}

document.addEventListener("DOMContentLoaded", loadTeacherSections);
</script>
{% endblock %}
