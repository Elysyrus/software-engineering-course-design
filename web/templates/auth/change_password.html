{% extends "base.html" %}
{% block title %}修改登录密码{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <h2 style="font-size: 1.25rem; margin-bottom: 0.5rem;" id="pwd-page-title">修改密码</h2>
    <p id="first-login-notice" style="display:none; color: var(--warning); font-size: 0.85rem; margin-bottom: 1rem; background: var(--warning-bg); padding: 0.5rem; border-radius: 4px;">
      您当前为首次登录，为了保障选课安全，必须先将初始密码更改为强密码。
    </p>
    <form id="change-pwd-form">
      <div class="form-group">
        <label class="form-label">原密码</label>
        <input type="password" id="old-password" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">新密码</label>
        <input type="password" id="new-password" class="form-input" required placeholder="长度不少于 8 位，包含数字和字母">
      </div>
      <div class="form-group">
        <label class="form-label">确认新密码</label>
        <input type="password" id="confirm-password" class="form-input" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;" id="submit-pwd-btn">确认修改</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("first") === "true") {
  document.getElementById("first-login-notice").style.display = "block";
  document.getElementById("pwd-page-title").innerText = "首次登录强制改密";
}

document.getElementById("change-pwd-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const oldPwd = document.getElementById("old-password").value;
  const newPwd = document.getElementById("new-password").value;
  const confirmPwd = document.getElementById("confirm-password").value;

  if (newPwd !== confirmPwd) {
    SECD.showToast("两次输入的新密码不一致", "danger");
    return;
  }
  if (newPwd.length < 8) {
    SECD.showToast("新密码长度不能少于 8 位", "danger");
    return;
  }

  const btn = document.getElementById("submit-pwd-btn");
  btn.disabled = true;
  try {
    await SECD.request("/api/v1/auth/change-password", {
      method: "POST",
      body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
    });
    SECD.showToast("密码修改成功，请重新登录", "success");
    localStorage.clear();
    setTimeout(() => window.location.href = "/login", 1200);
  } catch (err) {
    btn.disabled = false;
  }
});
</script>
{% endblock %}
