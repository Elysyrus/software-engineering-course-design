{% extends "base.html" %}
{% set active_nav = 'users' %}
{% block title %}师生人员管理{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">师生账号与档案管理</h1>
  <button class="btn btn-primary" onclick="openCreateModal()">+ 新建师生账号</button>
</div>

<div class="card">
  <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
    <input type="text" id="user-search-kw" class="form-input" style="max-width: 320px;" placeholder="按学号/工号/姓名检索..." onkeyup="filterUsers()">
    <select id="user-role-filter" class="form-select" style="max-width: 160px;" onchange="filterUsers()">
      <option value="">全部角色</option>
      <option value="student">仅学生</option>
      <option value="teacher">仅教师</option>
    </select>
  </div>

  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>账号 / 标识</th>
          <th>姓名</th>
          <th>角色</th>
          <th>院系 / 部门</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="user-list-body">
        <tr><td colspan="6" class="empty-state">加载用户数据中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="user-form-modal" class="modal-backdrop">
  <div class="modal">
    <h3 style="margin-bottom: 1rem;">新建师生账号</h3>
    <form id="create-user-form">
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0;">
        学号或工号由系统按年份自动分配。
      </p>
      <div class="form-group">
        <label class="form-label">真实姓名</label>
        <input type="text" id="m-fullname" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">系统角色</label>
        <select id="m-role" class="form-select" required>
          <option value="student">学生 (student)</option>
          <option value="teacher">教师 (teacher)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">院系或部门</label>
        <input type="text" id="m-dept" class="form-input">
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.25rem;">
        <button type="button" class="btn btn-secondary" onclick="closeCreateModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存账号</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allUsers = [];

async function loadUsers() {
  try {
    allUsers = await SECD.request("/api/v1/admin/users");
    filterUsers();
  } catch (err) {
    document.getElementById("user-list-body").innerHTML = `<tr><td colspan="6" class="empty-state">无法获取人员信息</td></tr>`;
  }
}

function filterUsers() {
  const kw = document.getElementById("user-search-kw").value.trim().toLowerCase();
  const role = document.getElementById("user-role-filter").value;
  const filtered = allUsers.filter(u => {
    const matchKw = u.username.toLowerCase().includes(kw) || u.full_name.toLowerCase().includes(kw);
    const matchRole = role ? u.role === role : true;
    return matchKw && matchRole;
  });
  renderUsers(filtered);
}

function renderUsers(list) {
  const tbody = document.getElementById("user-list-body");
  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-state">未查询到符合条件的人员记录。</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(u => `
    <tr>
      <td><strong>${u.username}</strong></td>
      <td>${u.full_name}</td>
      <td><span class="role-badge role-${u.role}">${u.role}</span></td>
      <td>${u.department || '-'}</td>
      <td>${u.is_active ? '<span style="color:var(--success)">正常</span>' : '<span style="color:var(--danger)">已停用</span>'}</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="editUser(${u.id})">编辑资料</button>
        <button class="btn btn-sm btn-outline" onclick="resetUserPassword(${u.id}, '${u.username}')">重置密码</button>
        <button class="btn btn-sm ${u.is_active ? 'btn-danger' : 'btn-secondary'}" onclick="toggleUserStatus(${u.id},${u.is_active})">
          ${u.is_active ? '停用' : '启用'}
        </button>
        <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id}, '${u.username}')">删除人员</button>
      </td>
    </tr>
  `).join("");
}

function openCreateModal() { document.getElementById("user-form-modal").classList.add("show"); }
function closeCreateModal() { document.getElementById("user-form-modal").classList.remove("show"); }

document.getElementById("create-user-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    full_name: document.getElementById("m-fullname").value.trim(),
    role: document.getElementById("m-role").value,
    department: document.getElementById("m-dept").value.trim()
  };
  try {
    const created = await SECD.request("/api/v1/admin/users", { method: "POST", body: JSON.stringify(payload) });
    SECD.showToast(`账号创建成功，登录编号：${created.login_number}`);
    closeCreateModal();
    loadUsers();
  } catch (err) {}
});

async function resetUserPassword(userId, username) {
  const ok = await SECD.confirmAction(`确定将用户 ${username} 的密码重置为初始密码吗？`);
  if (!ok) return;
  try {
    await SECD.request(`/api/v1/admin/users/${userId}/reset-password`, { method: "POST" });
    SECD.showToast(`用户 ${username} 的密码已成功重置！首次登录须强制改密。`);
  } catch (err) {}
}

async function editUser(userId) {
  const user = allUsers.find(item => item.id === userId);
  if (!user) return;

  const fullName = window.prompt("请输入真实姓名：", user.full_name);
  if (fullName === null) return;
  if (!fullName.trim()) {
    SECD.showToast("姓名不能为空", "error");
    return;
  }

  const payload = { full_name: fullName.trim() };
  if (user.role === "teacher") {
    const department = window.prompt("请输入院系或部门：", user.department || "");
    if (department === null) return;
    payload.department = department.trim();
  }

  try {
    await SECD.request(`/api/v1/admin/users/${userId}`, {
      method: "PATCH",
      body: JSON.stringify(payload)
    });
    SECD.showToast("人员资料已更新");
    loadUsers();
  } catch (err) {}
}

async function deleteUser(userId, username) {
  const ok = await SECD.confirmAction(
    `确定删除人员 ${username} 吗？若已有业务记录，系统会保留历史并停用账号。`
  );
  if (!ok) return;
  try {
    const result = await SECD.request(`/api/v1/admin/users/${userId}`, {
      method: "DELETE"
    });
    SECD.showToast(result.message);
    loadUsers();
  } catch (err) {}
}

async function toggleUserStatus(userId, currentStatus) {
  const actionText = currentStatus ? "停用" : "启用";
  const ok = await SECD.confirmAction(`确定要${actionText}该账号吗？`);
  if (!ok) return;
  try {
    await SECD.request(`/api/v1/admin/users/${userId}/status`, {
      method: "PATCH",
      body: JSON.stringify({ is_active: !currentStatus })
    });
    SECD.showToast(`账号已${actionText}`);
    loadUsers();
  } catch (err) {}
}

document.addEventListener("DOMContentLoaded", loadUsers);
</script>
{% endblock %}
