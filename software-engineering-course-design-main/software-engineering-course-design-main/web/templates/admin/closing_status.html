{% extends "base.html" %}
{% set active_nav = 'status' %}
{% block title %}关闭结果与账单状态{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">选课决算结果与账单推送状态</h1>
  <button class="btn btn-outline btn-sm" onclick="loadClosingSummary()">刷新进度</button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.25rem;">
  <div class="card" style="margin-bottom:0;">
    <div style="color:var(--text-muted); font-size:0.85rem;">已成班教学班</div>
    <div style="font-size:1.6rem; font-weight:700; color:var(--success);" id="stat-opened">-</div>
  </div>
  <div class="card" style="margin-bottom:0;">
    <div style="color:var(--text-muted); font-size:0.85rem;">人数不足取消班次</div>
    <div style="font-size:1.6rem; font-weight:700; color:var(--danger);" id="stat-cancelled">-</div>
  </div>
  <div class="card" style="margin-bottom:0;">
    <div style="color:var(--text-muted); font-size:0.85rem;">学生选课总人次</div>
    <div style="font-size:1.6rem; font-weight:700; color:var(--primary);" id="stat-enrolled">-</div>
  </div>
  <div class="card" style="margin-bottom:0;">
    <div style="color:var(--text-muted); font-size:0.85rem;">财务账单同步状态</div>
    <div style="font-size:1.2rem; font-weight:700;" id="stat-billing">-</div>
  </div>
</div>

<div class="card">
  <h3 style="font-size: 1.1rem; margin-bottom: 0.75rem;">学生账单发送记录与明细</h3>
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>账单编号</th>
          <th>学号</th>
          <th>姓名</th>
          <th>选中门数</th>
          <th>应缴学费 (¥)</th>
          <th>账单发送状态</th>
          <th>推送时间 / 响应</th>
        </tr>
      </thead>
      <tbody id="billing-body">
        <tr><td colspan="7" class="empty-state">正在查询最新推送状态...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadClosingSummary() {
  try {
    const res = await SECD.request("/api/v1/admin/registration/closing-status");
    document.getElementById("stat-opened").innerText = res.opened_sections_count ?? 0;
    document.getElementById("stat-cancelled").innerText = res.cancelled_sections_count ?? 0;
    document.getElementById("stat-enrolled").innerText = res.total_enrolled_count ?? 0;

    const bStat = document.getElementById("stat-billing");
    if (res.billing_status === "ALL_SENT") {
      bStat.innerHTML = `<span style="color:var(--success)">全部发送成功</span>`;
    } else if (res.billing_status === "PARTIAL_FAIL") {
      bStat.innerHTML = `<span style="color:var(--danger)">部分推送失败</span>`;
    } else {
      bStat.innerHTML = `<span style="color:var(--warning)">推送处理中...</span>`;
    }

    const tbody = document.getElementById("billing-body");
    const bills = res.bills || [];
    if (bills.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state">尚未产生学生缴费账单记录。</td></tr>`;
      return;
    }
    tbody.innerHTML = bills.map(b => `
      <tr>
        <td><strong>#${b.bill_id}</strong></td>
        <td>${b.student_number}</td>
        <td>${b.student_name}</td>
        <td>${b.enrolled_count} 门</td>
        <td>¥ ${b.amount.toFixed(2)}</td>
        <td>
          <span class="role-badge ${b.status === 'SENT' ? 'role-student' : 'role-teacher'}">
            ${b.status === 'SENT' ? '发送成功' : (b.status === 'FAILED' ? '发送失败' : '排队中')}
          </span>
        </td>
        <td>${b.sent_at || '-'}</td>
      </tr>
    `).join("");
  } catch (err) {
    document.getElementById("billing-body").innerHTML = `<tr><td colspan="7" class="empty-state">获取状态数据失败</td></tr>`;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  loadClosingSummary();
  SECD.startPolling(loadClosingSummary, 6000);
});
</script>
{% endblock %}
